services:
  # ------------------------------------------------------------
  # NENC-Dashboard (Streamlit)
  # ------------------------------------------------------------
  nenc-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nenc-dashboard
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      # URL interna da API no container Docker
      - WHATSAPP_API_URL=http://nenc-whatsapp-api:8000
      # Caminho do banco SQLite montado via volume persistente
      - NENC_DB_PATH=/app/data/prosodia.db
    # Sem 'ports': o acesso entra apenas pelo Caddy, que termina o TLS.
    # Publicar 8501 no host exporia o formulario de login em HTTP puro.
    expose:
      - "8501"
    volumes:
      - ./data:/app/data
    networks:
      - nenc-network

  # ------------------------------------------------------------
  # API de importacao da Jornada (FastAPI, mesmo codigo e banco)
  # Recebe a pasta do projeto enviada por scripts/jornada_enviar.py e a
  # deixa como importacao pendente; quem grava e a revisao no app.
  # ------------------------------------------------------------
  nenc-import-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nenc-import-api
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - NENC_DB_PATH=/app/data/prosodia.db
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    # O HEALTHCHECK da imagem consulta o Streamlit (8501); aqui e a API.
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/jornada/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nenc-network

  # ------------------------------------------------------------
  # NencProsodiaWhatsapp-API (FastAPI)
  # ------------------------------------------------------------
  nenc-whatsapp-api:
    build:
      context: ../../whatsapp-api
      dockerfile: Dockerfile
    container_name: nenc-whatsapp-api
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ../../whatsapp-api/.env
    # Sem 'ports': alcancavel so pela rede interna do compose e pelo Caddy.
    expose:
      - "8000"
    volumes:
      - ../../whatsapp-api/data:/app/data
    networks:
      - nenc-network

  # ------------------------------------------------------------
  # Reverse Proxy & SSL Automático (Caddy)
  # ------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: nenc-caddy
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nenc-dashboard
      - nenc-import-api
      - nenc-whatsapp-api
    networks:
      - nenc-network

networks:
  nenc-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
